openapi: 3.1.0
info:
  title: Hotels API
  description: API for retrieving hotels by region
  version: 1.0.0

paths:
  /v1/hotels:
    get:
      summary: Get hotels by region
      description: Returns a JSON list of regions and corresponding hotels.
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: Hotel search query string
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            format: int32
          description: Limit hotels per one region
      responses:
        "200":
          description: A JSON object containing hotels by region
          content:
            application/json:
              schema:
                type: object
                properties:
                  hotels:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
              example:
                hotels:
                  Bavaro:
                    - "Impressive Resorts Spas"
                    - "Melia Punta Cana Beach Resort Adults Only"
                    - "Royalton Bavaro Resort Spa"
                  La Romana:
                    - "Santana Beach Resort"
                    - "Viva Wyndham Dominicus Palace Resort"
                  Punta Cana Hotels:
                    - "The Westin Punta Сana Resort Club"
                    - "Tortuga Bay Hotel at Punta Сana Resort Club"
                  Uvero Alto:
                    - "Dreams Punta Cana Resort Hotel"
                    - "Nickelodeon Hotels Resorts Punta Cana"
                    - "Sensatori Resort Punta Cana"
        "400":
          description: Bad Request
          content:
            text/plain:
              example: "HTTP page 400 Bad Request"
        "405":
          description: Method Not Allowed
          content:
            text/plain:
              example: "HTTP page 405 Method Not Allowed"
        "429":
          description: Too Many Requests
          content:
            text/plain:
              example: "HTTP page 429 Too Many Requests"
        "500":
          description: Internal Server Error
          content:
            text/plain:
              example: "HTTP page 500 Internal Server Error"
